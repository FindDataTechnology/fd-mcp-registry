providers:
  logto:
    display_name: "Logto"
    client_id: "${LOGTO_CLIENT_ID}"
    client_secret: "${LOGTO_CLIENT_SECRET}"
    auth_url: "${LOGTO_EXTERNAL_URL}/oidc/auth"
    token_url: "${LOGTO_URL}/oidc/token"
    user_info_url: "${LOGTO_URL}/oidc/me"
    logout_url: "${LOGTO_EXTERNAL_URL}/oidc/session/end"
    # Logto: first-party apps must NOT request profile/email scopes
    # (full userinfo is returned without them; requesting them is rejected)
    # app must be first-party (is_third_party=false) for these scopes to be allowed
    scopes: ["openid", "offline_access", "profile", "email", "roles"]
    response_type: "code"
    grant_type: "authorization_code"
    username_claim: "username"
    groups_claim: "roles"
    email_claim: "email"
    name_claim: "name"
    enabled: "${LOGTO_ENABLED}"

session:
  max_age_seconds: 28800  # 8 hours
  cookie_name: "mcp_oauth_session"
  secure: true  # Set to false for development
  httponly: true
  samesite: "lax"
  domain: "${SESSION_COOKIE_DOMAIN}"  # Set to your domain (with leading dot) to share cookies across subdomains, e.g., ".example.com"

# Registry integration settings
registry:
  callback_url: "${REGISTRY_URL}/auth/callback"
  success_redirect: "${REGISTRY_URL}/"
  error_redirect: "${REGISTRY_URL}/login"
