# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push github main → build here → push hkccr → cheap-3 tcr-relay backfills ccr
# (Guangzhou) every 5 minutes → deploy hosts pull from ccr.
# Matrix: mcp-registry (docker/Dockerfile.registry) + mcp-auth-server
# (docker/Dockerfile.auth, flattened auth_server/ layout).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: yizuo

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp-registry
            dockerfile: docker/Dockerfile.registry
          - image: mcp-auth-server
            dockerfile: docker/Dockerfile.auth
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_VERSION=fd-1.1.2
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}