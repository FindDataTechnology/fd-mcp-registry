# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push github main → build here → push hkccr → cheap-3 tcr-relay backfills ccr
# (Guangzhou) every 5 minutes → deploy hosts pull from ccr.
# Matrix: mcp-registry (docker/Dockerfile.registry) + mcp-auth-server
# (docker/Dockerfile.auth, flattened auth_server/ layout).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: yizuo

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp-registry
            dockerfile: docker/Dockerfile.registry
          - image: mcp-auth-server
            dockerfile: docker/Dockerfile.auth
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_VERSION=fd-1.2.0
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # slim-registry-image: dependency-budget gate for the registry image.
      # Rebuild is a cache hit (layers already pushed); assertions enforce the
      # registry-lineage spec: size budget + fastembed present + torch absent.
      - name: Assert image dependency budget (mcp-registry)
        if: matrix.image == 'mcp-registry'
        run: |
          docker buildx build --file ${{ matrix.dockerfile }} \
            --build-arg BUILD_VERSION=fd-1.2.0 \
            --load -t assert:mcp-registry .
          SIZE=$(docker image inspect assert:mcp-registry --format '{{.Size}}')
          LIMIT=$((1600 * 1024 * 1024))
          echo "image size: $SIZE bytes (~$((SIZE / 1024 / 1024))MB), budget: 1600MB"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::image size $((SIZE / 1024 / 1024))MB exceeds the 1600MB dependency budget (registry-lineage)"
            exit 1
          fi
          docker run --rm --entrypoint /app/.venv/bin/python assert:mcp-registry \
            -c "import fastembed; print('fastembed import: OK')"
          if docker run --rm --entrypoint /app/.venv/bin/python assert:mcp-registry \
            -c "import torch" 2>/dev/null; then
            echo "::error::torch is present in the runtime image (registry-lineage budget violated)"
            exit 1
          else
            echo "torch absent: OK"
          fi