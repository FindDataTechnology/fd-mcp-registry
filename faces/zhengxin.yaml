# zhengxin line face (unify-line-entry-at-registry-gateway 4.2). One stable entry
# over /fd-zhengxin-reference so an sk- customer reaches the line with a 门K ticket
# minted for their sub2api id. The backend enables its ticket path via its own
# <PREFIX>_LINE_TOKEN_ISSUER / _PUBLIC_KEY_PEM, already deployed.
face: zhengxin
server_name: Zhengxin
description: "Zhengxin reference line: concepts, ideology, relations, regimes, entity dossiers."
audience: line-customer
exposure: internal
brand_policy:
  strip_provenance: false
required_scopes:
  - mcp-zhengxin-execute
is_enabled: true
tools:
  - {backend: /fd-zhengxin-reference, tool_name: concept_lookup, alias: concept_lookup}
  - {backend: /fd-zhengxin-reference, tool_name: ideology_query, alias: ideology_query}
  - {backend: /fd-zhengxin-reference, tool_name: relation_query, alias: relation_query}
  - {backend: /fd-zhengxin-reference, tool_name: regime_timeseries, alias: regime_timeseries}
  - {backend: /fd-zhengxin-reference, tool_name: entity_dossier, alias: entity_dossier}
  - {backend: /fd-zhengxin-reference, tool_name: source_status, alias: source_status}
