# Wire customer face: the paying-customer tool surface for the Wire (柏讯) line,
# served at /virtual/wire-customer. It aggregates the Wire operation/build MCPs,
# the info-stream index, and the business MCP (branded shared reads plus domain
# federation) into one stable entry so a customer agent connects once instead of
# to four servers.
#
# Shared read tools (read / ai_search / graph_search / list_concepts) are served
# by the business backend with finddata branding, so the face references the
# business tools rather than the open-data originals. This is the brand policy
# realized by backend choice (see design D3).
face: wire-customer
server_name: Wire Customer
description: "Paying-customer tool surface for the Wire line: demands, datasets, market, artifacts, info stream, and domain federation."
audience: paying-customer
exposure: commercial
brand_policy:
  strip_provenance: true
  brand: finddata
required_scopes:
  - mcp-wire-execute
is_enabled: false
tools:
  - {backend: /wire-ops-mcp, tool_name: wire_action_list, alias: wire_action_list}
  - {backend: /wire-ops-mcp, tool_name: wire_action_propose, alias: wire_action_propose}
  - {backend: /wire-ops-mcp, tool_name: wire_action_status, alias: wire_action_status}
