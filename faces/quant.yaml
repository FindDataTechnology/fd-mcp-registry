# Quant line face: the deterministic compute surface for the investing line,
# served at /virtual/quant. A customer agent connects once and gets indicators,
# portfolio statistics, factor stats, valuation operators and validation helpers
# without going through the raw 58-tool backend.
#
# SCOPE OF EXPOSURE (deliberate, 2026-11-28):
#   decision_ledger's 6 tools (record_decision / settle_decision /
#   settle_portfolio / list_pending_decisions / retrieve_decisions /
#   summarize_pack_performance) are NOT on this face. They write to the decision
#   ledger and are per-tenant state, not computation. Exposing them to every
#   sk- customer would let one tenant write rows another can read. If a customer
#   genuinely needs the ledger, it goes through SUB2API_KEY_CALLER_SCOPES plus a
#   separate, tenant-scoped face -- not by widening this one.
#
# Enabled 2026-11-28. Both preconditions are met:
#   (a) fd-quant's registry entry declares all 58 tools commercial
#       (metadata.surface.commercial_tools, manifest_verified_at 2026-11-12);
#   (b) mcp-quant-execute is granted -- currently to the demo probe client
#       (idp_m2m_clients 916d9pni64m6pz2d51ytm) so the daily readiness reader
#       proves the surface works through the real gateway path.
#
# A customer reaches it by adding "mcp-quant-execute" to their entry in
# SUB2API_KEY_CALLER_SCOPES. That is a per-customer grant and deliberately not
# pre-applied: it widens what a paying account can call, so it is an operator
# decision, not a default.
#
# decision_ledger stays off this face either way (see the note above): the six
# ledger tools write tenant state.
face: quant
server_name: Quant
description: "Investing line compute surface: technical indicators, portfolio and factor statistics, regime detection, valuation operators, and look-ahead/observation validators."
audience: paying-customer
exposure: commercial
brand_policy:
  strip_provenance: false
required_scopes:
  - mcp-quant-execute
is_enabled: true
tools:
  - {backend: /fd-quant, tool_name: check_preconditions_monitorable, alias: check_preconditions_monitorable}
